<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路線優化｜AI課程(Paul)</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="practice.css">
  <style>
    .control-panel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .control {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(2, 6, 23, .34);
    }

    .control b {
      display: block;
      margin-bottom: 10px;
      color: #f8fbff;
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .seg button,
    .route-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(15, 23, 42, .74);
      color: #dbeafe;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .seg button.active,
    .route-button.primary {
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--accent), #22d3ee);
      color: #07111f;
    }

    .route-demo {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    .map-panel {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 58%);
      border-radius: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px),
        radial-gradient(circle at 28% 22%, rgba(167, 139, 250, .18), transparent 30%),
        rgba(2, 6, 23, .42);
      background-size: 44px 44px, 44px 44px, auto, auto;
      box-shadow: 0 20px 52px rgba(0, 0, 0, .26);
    }

    .route-map {
      display: block;
      width: 100%;
      height: auto;
      min-height: 420px;
    }

    .route-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 7;
      opacity: .92;
      stroke-dasharray: 13 12;
      animation: routeFlow 2.7s linear infinite;
    }

    @keyframes routeFlow {
      to { stroke-dashoffset: -50; }
    }

    .node circle {
      stroke: rgba(255, 255, 255, .78);
      stroke-width: 3;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .28));
    }

    .node text {
      fill: #07111f;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .label {
      fill: #dbeafe;
      font-size: 13px;
      font-weight: 900;
      paint-order: stroke;
      stroke: rgba(2, 6, 23, .9);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .vehicle-stack {
      display: grid;
      gap: 12px;
    }

    .vehicle-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: rgba(2, 6, 23, .38);
    }

    .vehicle-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .vehicle-name {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #f8fbff;
      font-size: 18px;
      font-weight: 900;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--van);
      box-shadow: 0 0 18px var(--van);
    }

    .route-pill {
      border-radius: 999px;
      padding: 6px 9px;
      background: color-mix(in srgb, var(--van), transparent 84%);
      color: var(--van);
      font-size: 12px;
      font-weight: 900;
    }

    .route-seq {
      color: #dbeafe;
      font-weight: 800;
      line-height: 1.55;
    }

    .risk {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(15, 23, 42, .62);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .risk strong { color: #fbbf24; }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .legend-item {
      padding: 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, .62);
      border: 1px solid var(--line);
    }

    .legend-item b {
      display: block;
      color: #f8fbff;
      margin-bottom: 4px;
    }

    .legend-item span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      .control-panel,
      .route-demo,
      .legend {
        grid-template-columns: 1fr;
      }

      .route-map { min-height: 330px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← 回首頁</a>
    <section class="page" style="--accent:#a78bfa">
      <p class="tag">Routing Problem</p>
      <h1>路線優化</h1>
      <p class="hero-copy">這次做成可改的 VRP 沙盤。先改「幾台車、幾個配送點、分配策略」，再看地圖和每台車路線如何變化。這是教學模擬，不是真正地圖最短路。</p>

      <div class="control-panel">
        <div class="control">
          <b>台車數</b>
          <div class="seg" data-control="vehicles">
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3" class="active">3</button>
            <button type="button" data-value="4">4</button>
          </div>
        </div>

        <div class="control">
          <b>配送點</b>
          <div class="seg" data-control="points">
            <button type="button" data-value="6">6</button>
            <button type="button" data-value="9" class="active">9</button>
            <button type="button" data-value="12">12</button>
          </div>
        </div>

        <div class="control">
          <b>分配策略</b>
          <div class="seg" data-control="strategy">
            <button type="button" data-value="zone" class="active">區域</button>
            <button type="button" data-value="balance">平均</button>
            <button type="button" data-value="priority">急件</button>
          </div>
        </div>
      </div>

      <div class="route-demo">
        <div class="map-panel">
          <svg id="routeMap" class="route-map" viewBox="0 0 760 520" role="img" aria-label="可改的路線問題沙盤"></svg>
          <div class="route-controls" style="padding:14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap">
            <button class="route-button primary" id="generate" type="button">重新產生路線</button>
            <button class="route-button" id="shuffle" type="button">換一組點位</button>
          </div>
        </div>

        <div id="vehicleStack" class="vehicle-stack"></div>
      </div>

      <div class="legend">
        <div class="legend-item"><b>你改的是問題</b><span>台車數、配送點數、分配策略一變，路線圖就會跟著重畫。</span></div>
        <div class="legend-item"><b>LLM 做草稿</b><span>適合整理資料、分組、說明風險，但不保證真的是最短路。</span></div>
        <div class="legend-item"><b>演算法做最佳化</b><span>正式版要接 OR-Tools、Google Routes 或 Mapbox 才能真的算距離。</span></div>
      </div>

      <div class="panel wide" style="margin-top:16px">
        <h2>目前 Prompt 草稿</h2>
        <pre id="promptBox" class="codebox"></pre>
      </div>
    </section>
  </main>

  <script>
    const colors = ["#22d3ee", "#a3e635", "#fb7185", "#fbbf24"];
    const names = ["Camden", "Islington", "Shoreditch", "Hackney", "Stratford", "Greenwich", "Brixton", "Chelsea", "Ealing", "Wembley", "Fulham", "Canary Wharf"];
    let state = { vehicles: 3, points: 9, strategy: "zone", seed: 0 };

    const basePoints = [
      [210, 140], [130, 260], [270, 365], [420, 105],
      [560, 165], [620, 330], [500, 420], [310, 445],
      [165, 430], [120, 105], [610, 80], [690, 250]
    ];

    function variedPoints() {
      return basePoints.slice(0, state.points).map(([x, y], i) => {
        const offset = ((state.seed + i * 37) % 31) - 15;
        return { id: `P${i + 1}`, name: names[i], x: x + offset, y: y - offset };
      });
    }

    function assign(points) {
      const groups = Array.from({ length: state.vehicles }, () => []);
      points.forEach((point, index) => {
        let vehicle = 0;
        if (state.strategy === "balance") vehicle = index % state.vehicles;
        if (state.strategy === "zone") vehicle = Math.min(state.vehicles - 1, Math.floor(index / Math.ceil(points.length / state.vehicles)));
        if (state.strategy === "priority") vehicle = index < state.vehicles ? index : (index + 1) % state.vehicles;
        groups[vehicle].push(point);
      });
      return groups;
    }

    function pathFor(points) {
      const hub = "M380 260";
      return `${hub} ${points.map((p) => `L${p.x} ${p.y}`).join(" ")} L380 260`;
    }

    function render() {
      const points = variedPoints();
      const groups = assign(points);
      const svg = document.getElementById("routeMap");
      svg.innerHTML = "";

      groups.forEach((group, i) => {
        if (!group.length) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathFor(group));
        path.setAttribute("class", "route-line");
        path.setAttribute("stroke", colors[i]);
        svg.appendChild(path);
      });

      const hub = document.createElementNS("http://www.w3.org/2000/svg", "g");
      hub.setAttribute("class", "node");
      hub.setAttribute("transform", "translate(380 260)");
      hub.innerHTML = `<circle r="34" fill="#f8fbff"></circle><text>H</text><text class="label" x="0" y="55">Hub</text>`;
      svg.appendChild(hub);

      groups.forEach((group, vehicleIndex) => {
        group.forEach((point) => {
          const node = document.createElementNS("http://www.w3.org/2000/svg", "g");
          node.setAttribute("class", "node");
          node.setAttribute("transform", `translate(${point.x} ${point.y})`);
          node.innerHTML = `<circle r="25" fill="${colors[vehicleIndex]}"></circle><text>${point.id}</text><text class="label" x="0" y="${point.y < 150 ? 44 : -38}">${point.name}</text>`;
          svg.appendChild(node);
        });
      });

      document.getElementById("vehicleStack").innerHTML = groups.map((group, i) => {
        const seq = group.map((p) => p.id).join(" → ");
        const risk = state.strategy === "priority"
          ? "急件優先：前幾點先分給不同車，降低等待時間。"
          : state.strategy === "balance"
            ? "平均分配：每台車站點數接近，但可能跨區跑比較遠。"
            : "區域分配：同區集中，路線好懂，但車輛負載可能不平均。";
        return `<div class="vehicle-card" style="--van:${colors[i]}">
          <div class="vehicle-head">
            <span class="vehicle-name"><span class="dot"></span>Van ${String.fromCharCode(65 + i)}</span>
            <span class="route-pill">${group.length} stops</span>
          </div>
          <div class="route-seq">Hub${seq ? " → " + seq : ""} → Hub</div>
          <div class="risk"><strong>提醒：</strong>${risk}</div>
        </div>`;
      }).join("");

      document.getElementById("promptBox").textContent =
`你是物流排程助理。
請把 ${state.points} 個配送點分給 ${state.vehicles} 台車。
分配策略：${state.strategy === "zone" ? "同區集中" : state.strategy === "balance" ? "平均站點數" : "急件優先"}。
輸出：
1. 每台車的站點順序
2. 為什麼這樣分
3. 哪些車可能超時、超載或跨區
4. 哪些點需要人工確認`;
    }

    document.querySelectorAll("[data-control]").forEach((group) => {
      group.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          group.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          const key = group.dataset.control;
          state[key] = key === "strategy" ? button.dataset.value : Number(button.dataset.value);
          render();
        });
      });
    });

    document.getElementById("generate").addEventListener("click", render);
    document.getElementById("shuffle").addEventListener("click", () => {
      state.seed += 11;
      render();
    });

    render();
  </script>
</body>
</html>
