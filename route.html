<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出車路線｜AI課程(Paul)</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="practice.css">
  <style>
    .route-demo { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:18px; margin-top:30px; align-items:start; }
    .map-panel { border:1px solid color-mix(in srgb,var(--accent),transparent 58%); border-radius:18px; background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),rgba(2,6,23,.42); background-size:42px 42px; overflow:hidden; }
    .route-map { display:block; width:100%; min-height:430px; }
    .route-line { fill:none; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:12 12; animation:flow 2.7s linear infinite; opacity:.9; }
    @keyframes flow { to { stroke-dashoffset:-48; } }
    .node circle { stroke:rgba(255,255,255,.8); stroke-width:3; filter:drop-shadow(0 8px 12px rgba(0,0,0,.28)); }
    .node text { fill:#07111f; font:900 16px Arial; text-anchor:middle; dominant-baseline:central; }
    .label { fill:#dbeafe; font:900 12px Arial; paint-order:stroke; stroke:rgba(2,6,23,.9); stroke-width:4px; stroke-linejoin:round; }
    .vehicle-stack { display:grid; gap:12px; }
    .vehicle-card { border:1px solid var(--line); border-radius:16px; padding:16px; background:rgba(2,6,23,.38); }
    .vehicle-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
    .vehicle-name { display:inline-flex; align-items:center; gap:9px; color:#f8fbff; font-size:18px; font-weight:900; }
    .dot { width:13px; height:13px; border-radius:50%; background:var(--van); box-shadow:0 0 18px var(--van); }
    .route-pill { border-radius:999px; padding:6px 9px; background:color-mix(in srgb,var(--van),transparent 84%); color:var(--van); font-size:12px; font-weight:900; }
    .loadbar { height:10px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; margin:10px 0; }
    .loadbar span { display:block; height:100%; width:var(--load); background:var(--van); }
    .route-seq { color:#dbeafe; font-weight:800; line-height:1.55; }
    .risk { margin-top:10px; padding:10px; border-radius:12px; background:rgba(15,23,42,.62); color:var(--muted); font-size:13px; line-height:1.5; }
    .risk strong { color:#fbbf24; }
    .toggle-row { display:flex; flex-wrap:wrap; gap:10px; padding:14px; border-top:1px solid var(--line); }
    .route-button { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:rgba(15,23,42,.74); color:#dbeafe; font:inherit; font-weight:900; cursor:pointer; }
    .route-button.active { border-color:var(--accent); background:linear-gradient(135deg,var(--accent),#22d3ee); color:#07111f; }
    .delivery-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px; }
    .delivery { padding:11px; border-radius:12px; background:rgba(15,23,42,.62); border:1px solid var(--line); }
    .delivery b { color:#f8fbff; display:block; margin-bottom:4px; }
    .delivery span { color:var(--muted); font-size:12px; line-height:1.45; display:block; }
    @media(max-width:860px){ .route-demo,.delivery-list{grid-template-columns:1fr;} .route-map{min-height:330px;} }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← 回首頁</a>
    <section class="page" style="--accent:#a78bfa">
      <p class="tag">M11 Demo6</p>
      <h1>出車路線</h1>
      <p class="hero-copy">依照課程檔 `M11 Demo6 路線優化（配送點_車輛_優化路線）` 重寫。這裡的假資料是 15 個配送點、2 台車、重量限制、時間窗與一份優化路線範例。</p>

      <div class="metric-row">
        <div class="metric"><strong>15</strong><span>配送點</span></div>
        <div class="metric"><strong>2</strong><span>車輛</span></div>
        <div class="metric"><strong>740/800</strong><span>車A 載重 kg</span></div>
        <div class="metric"><strong>490/500</strong><span>車B 載重 kg</span></div>
      </div>

      <div class="route-demo">
        <div class="map-panel">
          <svg id="routeMap" class="route-map" viewBox="0 0 760 520" role="img" aria-label="Demo6 兩台車十五配送點路線"></svg>
          <div class="toggle-row">
            <button class="route-button active" data-mode="sample" type="button">課程範例路線</button>
            <button class="route-button" data-mode="time" type="button">時間窗優先</button>
            <button class="route-button" data-mode="load" type="button">載重均衡</button>
          </div>
        </div>

        <div id="vehicleStack" class="vehicle-stack"></div>
      </div>

      <div class="panel wide" style="margin-top:16px">
        <h2>配送點資料長這樣</h2>
        <div id="deliveryList" class="delivery-list"></div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>AI 做什麼</h2>
          <p>讀取配送點、重量、時間窗、備註，把問題整理成「哪台車跑哪些點」的草稿，並解釋為什麼這樣排。</p>
        </div>
        <div class="panel">
          <h2>演算法做什麼</h2>
          <p>正式版要用 OR-Tools / Google Routes / Mapbox 真的計算距離、時間、容量與路線順序。LLM 不該自己假裝算最短路。</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const points = [
      ["D01","誠品信義店","信義","09:00-12:00",80,210,180],["D02","三創生活園區","中正","09:00-18:00",45,260,310],
      ["D03","台北101辦公大樓","信義","13:00-17:00",140,245,210],["D04","南港軟體園區","南港","09:00-12:00",60,520,185],
      ["D05","饒河夜市商家","松山","14:00-18:00",35,435,245],["D06","微風南山","信義","10:00-16:00",110,230,245],
      ["D07","松山機場貨運站","松山","08:00-11:00",180,465,135],["D08","中山地下街店面","中山","11:00-15:00",60,330,170],
      ["D09","大稻埕迪化街","大同","09:00-13:00",45,270,140],["D10","圓山花博","中山","10:00-16:00",65,340,110],
      ["D11","公館商圈","中正","12:00-18:00",50,285,385],["D12","內湖科技園區","內湖","09:00-12:00",160,610,115],
      ["D13","西門町商圈","萬華","13:00-19:00",40,210,330],["D14","松菸文創園區","信義","10:00-17:00",70,300,230],
      ["D15","南港車站","南港","09:00-18:00",90,565,235]
    ];
    const plans = {
      sample: [["D07","D12","D15","D04","D03","D06"],["D01","D14","D08","D09","D10","D05","D02","D11","D13"]],
      time: [["D07","D12","D04","D01","D09","D10","D08"],["D06","D14","D03","D11","D05","D13","D02","D15"]],
      load: [["D07","D03","D06","D15","D08","D11"],["D12","D01","D14","D04","D10","D02","D09","D13","D05"]]
    };
    const vehicles = [{name:"車A", type:"3.5噸貨車", cap:800, color:"#22d3ee"}, {name:"車B", type:"1噸小貨車", cap:500, color:"#a3e635"}];
    let mode = "sample";
    const byId = Object.fromEntries(points.map(p => [p[0], p]));
    function path(ids){ return "M380 285 " + ids.map(id => `L${byId[id][5]} ${byId[id][6]}`).join(" ") + " L380 285"; }
    function render(){
      const svg = document.getElementById("routeMap");
      svg.innerHTML = "";
      plans[mode].forEach((ids,i)=>{ const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",path(ids)); p.setAttribute("class","route-line"); p.setAttribute("stroke",vehicles[i].color); svg.appendChild(p); });
      const hub=document.createElementNS("http://www.w3.org/2000/svg","g"); hub.setAttribute("class","node"); hub.setAttribute("transform","translate(380 285)"); hub.innerHTML='<circle r="34" fill="#f8fbff"></circle><text>H</text><text class="label" x="0" y="55">公司倉庫</text>'; svg.appendChild(hub);
      points.forEach(pt=>{ const owner=plans[mode].findIndex(ids=>ids.includes(pt[0])); const g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.setAttribute("class","node"); g.setAttribute("transform",`translate(${pt[5]} ${pt[6]})`); g.innerHTML=`<circle r="24" fill="${vehicles[owner].color}"></circle><text>${pt[0].replace("D","")}</text><text class="label" x="0" y="${pt[6] < 150 ? 42 : -36}">${pt[2]}</text>`; svg.appendChild(g); });
      document.getElementById("vehicleStack").innerHTML = plans[mode].map((ids,i)=>{ const total=ids.reduce((s,id)=>s+byId[id][4],0); const names=ids.map(id=>`${id} ${byId[id][1]}`).join(" → "); return `<div class="vehicle-card" style="--van:${vehicles[i].color};--load:${Math.round(total/vehicles[i].cap*100)}%"><div class="vehicle-head"><span class="vehicle-name"><span class="dot"></span>${vehicles[i].name} ${vehicles[i].type}</span><span class="route-pill">${ids.length} stops</span></div><div class="route-seq">倉庫 → ${names} → 倉庫</div><div class="loadbar"><span></span></div><div class="risk"><strong>載重：</strong>${total}kg / ${vehicles[i].cap}kg。${mode==="sample" ? "這是課程檔的優化路線範例。" : "這是前端模擬的替代策略，用來比較不同排法。"}</div></div>`; }).join("");
    }
    document.getElementById("deliveryList").innerHTML = points.map(p=>`<div class="delivery"><b>${p[0]} ${p[1]}</b><span>${p[2]}｜${p[3]}｜${p[4]}kg</span></div>`).join("");
    document.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll("[data-mode]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");mode=btn.dataset.mode;render();}));
    render();
  </script>
</body>
</html>
